# Nome da Aplicação
spring.application.name=petnet-api

# Configurações de Conexão com o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dbpetnet
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
# update: Atualiza o schema das tabelas automaticamente com base nas entidades JPA
spring.jpa.hibernate.ddl-auto=update

# Exibe os comandos SQL gerados pelo Hibernate no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
